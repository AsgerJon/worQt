[build-system]
requires = ['setuptools>=69.5.1']
build-backend = 'setuptools.build_meta'


[project]
name = "worQt"
version = "0.0.1"
authors = [
    { name = "Asger Jon Vistisen", email = "asgerjon2@gmail.com" },
]
description = "Collection of Utilities for Qt for Python"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "worktoy>=1.0.0rc8",
    "PySide6>=6.5",
]
classifiers = [
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Topic :: Utilities"
]

[project.urls]
"Homepage" = "https://github.com/AsgerJon/worQt"
"Bug Tracker" = "https://github.com/AsgerJon/worQt/issues"

[tool.setuptools.packages.find]
where = ["src"]

# Coverage config for the 'worQt.qtest' harness. 'worQt.qtest' isolates
# each 'AppTest' in its own child process ('python -m worQt.qtest
# <module>'); 'parallel = true' lets the parent and every child write a
# separate data file ('.coverage.<host>.<pid>.<rand>') that 'coverage
# combine' merges afterward. Set 'WORQT_COVERAGE=1' so the harness launches
# each child under 'coverage run' (see AppTestRun and coverage_test.sh).
[tool.coverage.run]
parallel = true
branch = true
source = ["worQt"]

[tool.coverage.report]
skip_covered = false
# Keep the default '# pragma: no cover' and also exclude the standard
# '__main__' entry guards (their error branches are only reachable by
# feeding the runner bad input, which cannot happen in a green suite).
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
